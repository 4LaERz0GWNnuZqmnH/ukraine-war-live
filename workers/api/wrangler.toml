name = "uwl-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

[[routes]]
pattern = "api.ukraine.bugg.club"
custom_domain = true

# Aggregate /hit datapoints into stats:summary every 2 hours (offset from the
# ingest crons at :00 / :30).
[triggers]
crons = ["45 */2 * * *"]

[vars]
CF_ACCOUNT_ID = "c6e61d8cd829edc5b55ec99bb2b1e494"

[[kv_namespaces]]
binding = "KV"
id = "3b271a52902c4e4f8c1bd5923f7938b0"

# Privacy-preserving hit counter: one datapoint per page load, no cookies.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "uwl_hits"

# Internal-only invocation of the cron workers (for POST /admin/run seeding).
[[services]]
binding = "INGEST_STRIKES"
service = "uwl-ingest-strikes"

[[services]]
binding = "INGEST_GROUND"
service = "uwl-ingest-ground"

[[services]]
binding = "INGEST_FRONTLINE"
service = "uwl-ingest-frontline"

[[services]]
binding = "INGEST_SITREP"
service = "uwl-sitrep"

# Secrets (set once):
#   wrangler secret put RUN_KEY --config workers/api/wrangler.toml
#   wrangler secret put CF_ANALYTICS_TOKEN --config workers/api/wrangler.toml
#     ^ a Cloudflare API token with "Account Analytics: Read" (for the SQL query)
