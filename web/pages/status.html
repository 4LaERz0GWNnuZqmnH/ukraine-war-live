<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status — Ukraine War Live</title>
  <meta name="description" content="Live health of the Ukraine War Live pipeline: last run per worker, feed successes and failures, events per day." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css?v=202608302000" />
</head>
<body>
  <header>
    <a class="brand" href="/">UKRAINE&nbsp;WAR&nbsp;LIVE</a>
    <nav>
      <span class="navgroup">
        <a href="/">Map</a>
        <a href="/pages/today.html">Today</a>
        <a href="/pages/chronology.html">Chronology</a>
      </span>
      <span class="navsep">|</span>
      <span class="navgroup">
        <a href="/pages/blogs.html">Blogs</a>
      </span>
      <span class="navsep">|</span>
      <span class="navgroup">
        <a href="/pages/methodology.html">Methodology</a>
        <a href="/pages/build.html">How it's built</a>
        <a href="/pages/status.html" aria-current="page">Status</a>
        <a href="/feed.json">Feed</a>
      </span>
      <span class="navsep">|</span>
      <span class="navgroup">
        <a href="/pages/about.html">About</a>
        <a href="/pages/donate.html">Donate</a>
      </span>
    </nav>
  </header>

  <div class="doc">
    <h1>Status</h1>
    <p style="color:var(--muted)">Auto-refreshes every 60&nbsp;s. All times UTC.</p>

    <div class="statgrid" id="cards"></div>

    <h2>Events per day</h2>
    <div class="bars" id="bars"></div>
    <p class="muted" id="barsnote"></p>

    <h2>Last run — feeds</h2>
    <div id="feeds"></div>

    <h2>Recent runs</h2>
    <table><thead><tr><th>When</th><th>Pipeline</th><th>Items</th><th>Fresh</th><th>Extracted</th><th>Kept</th><th>Model</th><th>Notes</th></tr></thead>
    <tbody id="runs"></tbody></table>
  </div>

  <script>
    const API = "https://api.ukraine.bugg.club";
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ago = (iso) => { const t = Date.parse(iso); if (!t) return "—"; const m = Math.round((Date.now() - t) / 60000); if (m < 60) return m + "m ago"; const h = Math.floor(m / 60); return h < 48 ? h + "h ago" : Math.floor(h / 24) + "d ago"; };

    async function tick() {
      let st, idx;
      try {
        [st, idx] = await Promise.all([
          fetch(`${API}/status?t=${Math.floor(Date.now()/45000)}`, { cache: "no-store" }).then((r) => r.json()),
          fetch(`${API}/archive/index.json?t=${Math.floor(Date.now()/300000)}`, { cache: "no-store" }).then((r) => r.json()),
        ]);
      } catch (e) { document.getElementById("cards").innerHTML = '<div class="statcard"><div class="k">error</div><div class="v bad">offline</div></div>'; return; }

      const card = (k, v, cls) => `<div class="statcard"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${v}</div></div>`;
      const s = st.strikes || {}, g = st.ground || {}, f = st.frontline || {};
      const feedBad = (s.feeds_failed || []).length + (g.feeds_failed || []).length;
      document.getElementById("cards").innerHTML = [
        card("strikes — last run", ago(s.run_id)),
        card("ground — last run", ago(g.run_id)),
        card("front line — updated", ago(f.updated)),
        card("front line features", f.feature_count ?? "—"),
        card("feeds ok (last run)", (s.feeds_ok ?? "—") + " / " + ((s.feeds_ok || 0) + ((s.feeds_failed || []).length))),
        card("feed failures", feedBad, feedBad ? "bad" : "ok"),
        card("front-line snapshots", (st.frontline_snapshots || []).length),
        card("sitreps stored", (st.sitreps || []).length),
      ].join("");

      const days = Object.keys(idx).sort().slice(-21);
      const max = Math.max(1, ...days.map((d) => idx[d]));
      document.getElementById("bars").innerHTML = days.map((d) =>
        `<div class="bar" style="height:${Math.round((idx[d] / max) * 100)}%" title="${d}: ${idx[d]}"></div>`).join("");
      document.getElementById("barsnote").textContent = days.length
        ? `${days[0]} → ${days[days.length - 1]} · peak ${max}/day` : "no archive yet";

      const fails = [...(s.feeds_failed || []).map((x) => ["strikes", x]), ...(g.feeds_failed || []).map((x) => ["ground", x])];
      document.getElementById("feeds").innerHTML = fails.length
        ? '<table><tbody>' + fails.map(([p, x]) => `<tr><td>${p}</td><td class="bad">${esc(x)}</td></tr>`).join("") + "</tbody></table>"
        : '<p class="ok">All feeds succeeded on the last run.</p>';

      const shortModel = (m) => (m || "").replace(/^@cf\/[^/]+\//, "");
      document.getElementById("runs").innerHTML = (st.recent_runs || []).map((r) => {
        const notes = [
          r.ai_error && "AI: " + r.ai_error,
          r.archive_error && "archive: " + r.archive_error,
          (r.model_errors || []).length && "model fallback",
          r.promoted && (r.promoted + " promoted"),
          (r.feeds_failed || []).length && (r.feeds_failed.length + " feed fail"),
        ].filter(Boolean).join("; ");
        const bad = r.ai_error || r.archive_error || (r.feeds_failed || []).length;
        return `<tr><td>${esc((r.run_id || "").slice(0, 16).replace("T", " "))}</td><td>${esc(r.pipeline)}</td><td>${r.items ?? ""}</td><td>${r.fresh ?? ""}</td><td>${r.extracted ?? ""}</td><td>${r.kept ?? ""}</td><td>${esc(shortModel(r.model_used))}</td><td class="${bad ? "bad" : ""}">${esc(notes)}</td></tr>`;
      }).join("");
    }
    tick();
    setInterval(tick, 60000);
  </script>
</body>
</html>
