  <div class="doc" style="max-width:1100px">
    <h1>Chronology</h1>
    <p style="color:var(--muted)">
      The live feed (last few days). Newest first. Automated &amp; unverified.
      Last update <b id="updated">—</b> · next refresh in <b id="nextrefresh">—</b>.
    </p>

    <div class="filters">
      <select id="type"><option value="">All types</option></select>
      <select id="tier">
        <option value="">All confidence</option>
        <option value="high">High confidence</option>
        <option value="official_ua">Official — Ukraine</option>
        <option value="official_ru">Official — Russia</option>
        <option value="wire">News wire</option>
        <option value="osint">OSINT</option>
        <option value="state_media">State media</option>
      </select>
      <input id="q" type="search" placeholder="filter text…" />
      <button id="arch" type="button" title="Search the archive (last ~6 weeks)">search archive ↧</button>
    </div>
    <p class="src" id="archnote"></p>

    <table>
      <thead>
        <tr><th>Time (UTC)</th><th>Type</th><th>Place</th><th>Event</th><th>Confidence</th><th>Source</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const API_BASE = "https://api.ukraine.bugg.club";
    const TIER = {
      high: ["#22c55e", "High"], official_ua: ["#3b82f6", "UA official"],
      official_ru: ["#a855f7", "RU official"], wire: ["#f59e0b", "Wire"],
      osint: ["#9ca3af", "OSINT"], state_media: ["#ef4444", "State media"],
    };
    const TYPE_LABEL = {
      missile_strike: "Missile", drone_strike: "Drone", air_defense: "Air defence",
      deep_strike_ru: "Deep strike (RU)", naval: "Naval", energy_infra: "Energy",
      ground_engagement: "Ground", territorial_change: "Territory",
      casualty_report: "Casualties", diplomatic: "Diplomacy",
    };
    let ALL = [];
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const typeSel = document.getElementById("type");
    for (const [k, v] of Object.entries(TYPE_LABEL)) {
      const o = document.createElement("option"); o.value = k; o.textContent = v; typeSel.appendChild(o);
    }
    ["type", "tier", "q"].forEach((id) => document.getElementById(id).addEventListener("input", render));

    document.getElementById("arch").addEventListener("click", async () => {
      const q = document.getElementById("q").value.trim();
      const note = document.getElementById("archnote");
      if (q.length < 2) { note.textContent = "Type at least 2 characters, then search the archive."; return; }
      note.textContent = "searching archive…";
      try {
        const d = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}`, { cache: "default" }).then((r) => r.json());
        const have = new Set(ALL.map((e) => e.id));
        const extra = (d.results || []).filter((e) => !have.has(e.id));
        ALL = ALL.concat(extra).sort((a, b) => Date.parse(b.event_utc) - Date.parse(a.event_utc));
        note.textContent = `archive ${d.from} → ${d.to}: ${d.count} match${d.count === 1 ? "" : "es"}, ${extra.length} not already shown.`;
        render();
      } catch (e) { note.textContent = "archive search failed."; }
    });

    async function load() {
      const r = await fetch(`${API_BASE}/feed.json`, { cache: "no-store" });
      const d = await r.json();
      ALL = d.events || [];
      document.getElementById("updated").textContent = new Date(d.updated).toUTCString();
      render();
    }

    // Countdown to the next ingestion run: strikes fire at :00 and ground at :30
    // of every even UTC hour, so new events reach /feed.json on that cadence.
    // Only minutes are shown inside the final hour; before that it reads "~Nh".
    const INGEST_ALLOWANCE_MS = 3 * 60 * 1000; // model + write lag after the cron
    function nextIngestAt() {
      const now = Date.now();
      const base = new Date();
      const cands = [];
      for (let h = 0; h <= 3; h++) {
        for (const m of [0, 30]) {
          const t = new Date(base);
          t.setUTCHours(base.getUTCHours() + h, m, 0, 0);
          if (t.getUTCHours() % 2 === 0 && t.getTime() > now) cands.push(t.getTime());
        }
      }
      return Math.min(...cands) + INGEST_ALLOWANCE_MS;
    }
    function fmtRemaining(ms) {
      if (ms <= 0) return "any moment";
      const min = Math.floor(ms / 60000);
      if (min >= 60) return "~" + Math.floor(min / 60) + "h";
      if (min >= 1) return min + "m";
      return "<1m";
    }
    let refreshTarget = 0, refreshTimer = 0;
    function tickCountdown() {
      const el = document.getElementById("nextrefresh");
      if (el && refreshTarget) el.textContent = fmtRemaining(refreshTarget - Date.now());
    }
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTarget = nextIngestAt();
      tickCountdown();
      refreshTimer = setTimeout(async () => {
        try { await load(); } catch (e) { /* try again on the next cycle */ }
        scheduleRefresh();
      }, Math.max(1000, refreshTarget - Date.now()));
    }
    setInterval(tickCountdown, 15000);

    function render() {
      const t = document.getElementById("type").value;
      const tier = document.getElementById("tier").value;
      const q = document.getElementById("q").value.toLowerCase();
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      ALL.filter((e) => (!t || e.event_type === t) && (!tier || e.confidence_tier === tier) &&
        (!q || (e.headline + " " + e.summary + " " + e.location_name).toLowerCase().includes(q)))
        .forEach((e) => {
          const [c, lbl] = TIER[e.confidence_tier] || TIER.wire;
          const tr = document.createElement("tr");
          const when = new Date(e.event_utc).toISOString().slice(0, 16).replace("T", " ");
          tr.innerHTML =
            `<td><a href="/#event=${encodeURIComponent(e.id)}" title="Show on the map">${when}</a></td>` +
            `<td>${TYPE_LABEL[e.event_type] || e.event_type}</td>` +
            `<td>${esc(e.location_name || "")}${e.admin_region ? ", " + esc(e.admin_region) : ""}</td>` +
            `<td>${esc(e.headline)}<br><span style="color:var(--muted)">${esc(e.summary || "")}</span></td>` +
            `<td><span style="color:${c};font-weight:700">${lbl}</span></td>` +
            `<td><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.source_outlet || "link")}</a></td>`;
          rows.appendChild(tr);
        });
    }
    load().catch(() => {}).finally(scheduleRefresh);
  </script>
  <script src="/beacon.js" async></script>
</body>
